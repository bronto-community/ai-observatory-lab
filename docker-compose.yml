# Workshop credentials: `export AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... AWS_SESSION_TOKEN=...`
# Your own account: `export AWS_PROFILE=yourprofile` (~/.aws is mounted read-only).
x-agent: &agent
  image: ${AGENT_IMAGE:-ghcr.io/bronto-community/track-a-agent:latest}
  build:
    context: .
    dockerfile: agent/Dockerfile
  env_file: .env
  environment:
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_SESSION_TOKEN
    - AWS_PROFILE
    - AWS_REGION=${AWS_REGION:-us-west-2}
    - AGENT_STEP=${AGENT_STEP:-1}
    - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-global.amazon.nova-2-lite-v1:0}
  volumes:
    - ${HOME}/.aws:/root/.aws:ro

services:
  agent:
    <<: *agent
    ports: ["8080:8080"]

  doctor:
    <<: *agent
    profiles: [tools]
    command: ["python", "doctor.py"]

  traffic:
    <<: *agent
    profiles: [tools]
    command: ["python", "traffic.py"]
    network_mode: host
